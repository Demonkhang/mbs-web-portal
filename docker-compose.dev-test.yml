# Alias of standard docker-compose.yml for dev testing
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mbs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mbs_password_2026
      POSTGRES_DB: mbs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mbs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mbs_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:mbs_password_2026@postgres:5432/mbs_db?schema=public"
      JWT_SECRET: "mbs-docker-secret-key-2026"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mbs_web
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres_data:
