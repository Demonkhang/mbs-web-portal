version: '3.8'

services:
  # 1. PostgreSQL Database Container (Port 5432)
  postgres:
    image: postgres:16-alpine
    container_name: mbs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mbs_password_2026
      POSTGRES_DB: mbs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mbs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Core Express API Container (Port 4000)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mbs_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:mbs_password_2026@postgres:5432/mbs_db?schema=public"
      JWT_SECRET: "mbs-docker-secret-key-2026"
      LOCAL_UPLOAD_PATH: "./uploads"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Web/CMS React Nginx Container (Port 3001)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mbs_web
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres_data:
