version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mbs_postgres
    restart: always
    environment:
      POSTGRES_USER: mbs_user
      POSTGRES_PASSWORD: mbs_password
      POSTGRES_DB: mbs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    container_name: mbs_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: mbs_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: masterKeyMBS2026
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meili_data:
